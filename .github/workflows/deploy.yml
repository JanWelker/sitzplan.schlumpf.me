name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: build
          # Never force-push and never touch pr-preview/ — both would
          # destroy in-progress PR previews deployed by pr-preview.yml to
          # the same branch. See .github/workflows/pr-preview.yml.
          force: false
          clean-exclude: pr-preview

      - name: Wait for GitHub Pages / CDN to pick up the new deployment
        run: sleep 20

      - name: Smoke test the live deployment
        # Verifies the actually-served production page and its assets, not
        # just the local build — catches hosting-layer failures (like the
        # Jekyll issue this script's comment explains) that no local test
        # can see. Skips gracefully (not a failure) if the custom domain
        # isn't reachable yet, e.g. DNS not configured.
        run: node scripts/smoke-test.mjs "https://sitzplan.schlumpf.me/de"
