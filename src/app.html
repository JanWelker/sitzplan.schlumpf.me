<!doctype html>
<html lang="%sveltekit.lang%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		<link rel="icon" type="image/png" href="%sveltekit.assets%/favicon-32x32.png" sizes="32x32" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<!-- Self-hosted, cookieless visit counter. data-domains keeps a dev server
		     and a fork out of the numbers; a PR preview under the live hostname
		     counts as a page of it. -->
		<script
			defer
			src="https://analytics.k8s.wlkr.ch/script.js"
			data-website-id="2809d97f-6e3d-4897-bc27-799862aa85ed"
			data-domains="sitzplan.schlumpf.me"
		></script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
